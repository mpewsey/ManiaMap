name: Publish

on:
  push:
    tags:
    - "v[0-9]+.[0-9]+.[0-9]*"

jobs:
  publish:

    runs-on: windows-latest

    permissions:
      id-token: write

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v2
      with:
        dotnet-version: 6.0.x

    - name: Restore dependencies
      run: dotnet restore ".\src"

    - name: Build
      run: dotnet build ".\src" --configuration Release --no-restore

    - name: Test
      run: dotnet test ".\src" --no-restore --verbosity normal

    - name: Set Version from Tag
      run: echo "VERSION=${GITHUB_REF/refs\/tags\/v/}" >> $GITHUB_ENV

    - name: Pack
      run: dotnet pack ./src/ManiaMap/ManiaMap.csproj --configuration Release --output out

    - name: NuGet login
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: NuGet push
      run: dotnet nuget push ./out/MPewsey.ManiaMap.${VERSION}.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json

name: LinuxTests

on:
  push:
    branches: [ main ]
    paths:
    - '**.cs'
    - '**.csproj'
    - '**.sln'
    - '.github/workflows/**'
  pull_request:
    branches: [ main ]
    paths:
    - '**.cs'
    - '**.csproj'
    - '**.sln'
    - '.github/workflows/**'

jobs:
  unit-tests:

    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: 6.0.x

    - uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Add Linux native assets for CI test run
      if: runner.os == 'Linux'
      run: dotnet add "./src/ManiaMap/ManiaMap.csproj" package SkiaSharp.NativeAssets.Linux.NoDependencies

    - name: Restore dependencies
      run: dotnet restore "./src"

    - name: Build
      run: dotnet build "./src" --configuration Release --no-restore

    - name: Test
      run: dotnet test "./src" --no-restore --verbosity normal
